<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>NERTYGRAMM</title>
<style>
:root{--bg:#07050d;--p1:#120b22;--p2:#1b1033;--ac:#8b3dff;--ac2:#c4a0ff;--tx:#f2eeff;--mu:#9a90b8;--ln:#2a1d47;--bub:#1f1438;--me:linear-gradient(135deg,#9a4dff,#5b1fd1);--fs:15px;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme=dark]{--ac:#5b8cff;--ac2:#a9c0ff;--bg:#050506;--p1:#101114;--p2:#17181c;--ln:#26272d;--bub:#1c1d22;--me:linear-gradient(135deg,#5b8cff,#3a5fd0)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:var(--fs)/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:var(--p2);border-radius:12px;padding:11px 14px;min-height:44px;transition:.2s}
button:hover{filter:brightness(1.25)}button:active{transform:scale(.96)}
.pri{background:linear-gradient(135deg,#9a4dff,#6a26e8);color:#fff;font-weight:600}
.dng{color:#ff7a9c}
input:not([type=checkbox]):not([type=range]),select{width:100%;background:var(--bg);border:1px solid var(--ln);border-radius:12px;padding:12px;font-size:16px;margin:5px 0;outline:0;transition:.2s}
input:focus,select:focus{border-color:var(--ac)}
.mu{color:var(--mu);font-size:.85em}
.av{border-radius:50%;background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;flex:none}
.logo{margin:0;text-align:center;letter-spacing:3px;font-size:26px;background:linear-gradient(90deg,#c4a0ff,#8b3dff,#e0b3ff);-webkit-background-clip:text;background-clip:text;color:transparent}
#auth{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:16px;background:radial-gradient(circle at 30% 10%,#2a1058,#07050d 60%);z-index:20;overflow:auto}
.acard{width:100%;max-width:400px;background:var(--p1);border:1px solid var(--ln);border-radius:22px;padding:24px;animation:pop .4s}
.tabs{display:flex;margin:16px 0;background:var(--bg);border-radius:12px;padding:4px}.tabs b{flex:1;text-align:center;padding:10px;border-radius:9px;cursor:pointer}.tabs b.on{background:var(--ac);color:#fff}
.acard button{width:100%;margin-top:8px}
#app{display:none;height:100%;position:relative}
#side{width:340px;flex:none;display:flex;flex-direction:column;background:var(--p1);border-right:1px solid var(--ln);min-height:0}
.sh{display:flex;align-items:center;gap:6px;padding:12px}.sh .logo{flex:1;text-align:left;font-size:18px}
.sh button{padding:0;width:44px;background:none;font-size:20px}
#q{margin:0 12px 8px;width:calc(100% - 24px)}
#list{flex:1;overflow-y:auto;overflow-x:hidden}
#list h5{margin:10px 14px 4px;color:var(--ac2)}
.row{display:flex;gap:12px;padding:10px 14px;cursor:pointer;position:relative;transition:.15s;user-select:none}
.row:hover{background:var(--p2)}.row.act{background:linear-gradient(90deg,#3a1b73,#24134a)}
.dot{position:absolute;left:46px;top:42px;width:12px;height:12px;border-radius:50%;background:#3ddc84;border:2px solid var(--p1)}
.rb{flex:1;min-width:0}.r1,.r2{display:flex;justify-content:space-between;gap:8px}
.r1 b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.r1 span{color:var(--mu);font-size:.8em}
.r2 span{color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.9em}
.r2 u{text-decoration:none;background:var(--ac);color:#fff;border-radius:12px;padding:0 7px;font-size:.8em;min-width:22px;text-align:center}
.r2 em{font-style:normal;font-size:.8em}.dr{color:#ff7a9c}
.em{text-align:center;color:var(--mu);padding:30px}
#nav{display:flex;border-top:1px solid var(--ln)}#nav button{flex:1;border-radius:0;background:none;font-size:12px;padding:8px 2px}#nav button.on{color:var(--ac2)}#nav span{display:block;font-size:20px}
#main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
#empty{flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;color:var(--mu);gap:8px;background:radial-gradient(circle at 50% 30%,#1d0f3a,var(--bg) 70%)}
#cv{flex:1;display:none;flex-direction:column;min-height:0}
.ch{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--p1);border-bottom:1px solid var(--ln)}
.ch button{background:none;padding:0;width:42px;font-size:19px}#bk{display:none}
#hi{flex:1;display:flex;gap:10px;align-items:center;cursor:pointer;min-width:0}#hi div{min-width:0}#hn{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hs{font-size:.8em;color:var(--mu)}.ty{color:var(--ac2)}
#pinb{display:none;gap:8px;padding:8px 14px;background:var(--p2);cursor:pointer;font-size:.9em}#pinb span{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#sb{display:none;padding:6px 10px;background:var(--p1)}#sb input{margin:0}
#msgs{flex:1;overflow-y:auto;overflow-x:hidden;padding:12px;display:flex;flex-direction:column;gap:6px;background:radial-gradient(circle at 20% 0,#1d0f3a,#07050d 70%)}
#msgs.bg1{background:var(--bg)}#msgs.bg2{background:repeating-linear-gradient(45deg,#0b0716,#0b0716 14px,#100a1e 14px,#100a1e 28px)}
.m{display:flex;animation:msgIn .25s}.m.me{justify-content:flex-end}
.b{max-width:min(78%,520px);background:var(--bub);padding:7px 11px;border-radius:16px 16px 16px 4px;cursor:pointer;word-wrap:break-word;overflow-wrap:anywhere;transition:.15s}
.me .b{background:var(--me);border-radius:16px 16px 4px 16px}.b:hover{filter:brightness(1.12)}
.b img{max-width:100%;border-radius:10px;display:block;margin-bottom:4px}
.tx{white-space:pre-wrap}.mt{float:right;margin:6px 0 0 10px;font-size:.7em;opacity:.7}.mt i{font-style:normal}.mt i.rd{color:#7dffb0}
.sn{display:block;color:var(--ac2);font-weight:600}.fw{display:block;opacity:.8;font-size:.8em}
.rq{border-left:3px solid var(--ac2);padding:2px 8px;margin-bottom:4px;font-size:.85em;opacity:.9;background:#0004;border-radius:6px}.rq b{display:block}
.rc{clear:both;display:flex;gap:4px;flex-wrap:wrap;padding-top:4px}.rc span{background:#0005;border-radius:10px;padding:1px 8px;font-size:.8em}.rc span.mn{outline:1px solid var(--ac2)}
.hl{animation:fl 1.2s}
#rbar{display:none;align-items:center;gap:8px;padding:6px 12px;background:var(--p2);border-left:3px solid var(--ac)}#rbar div{flex:1;min-width:0;font-size:.85em}#rbar span{display:block;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;color:var(--mu)}#rbar button{padding:0;width:36px;min-height:36px;background:none}
#emo{display:none;grid-template-columns:repeat(8,1fr);background:var(--p2);padding:6px;max-height:160px;overflow-y:auto}#emo span{text-align:center;font-size:24px;padding:6px;cursor:pointer;border-radius:8px}#emo span:hover{background:var(--ln)}
.cmp{display:flex;align-items:flex-end;gap:6px;padding:8px;background:var(--p1);border-top:1px solid var(--ln)}
.cmp button{background:none;padding:0;width:44px;font-size:21px;flex:none}.cmp .snd{background:linear-gradient(135deg,#9a4dff,#6a26e8);border-radius:50%;height:44px;color:#fff}
#inp{flex:1;margin:0;resize:none;max-height:120px;background:var(--bg);border:1px solid var(--ln);border-radius:20px;padding:11px 14px;font-size:16px;outline:0;color:var(--tx);font-family:inherit}
#ctx{display:none;position:fixed;z-index:50;background:var(--p2);border:1px solid var(--ln);border-radius:14px;min-width:190px;padding:5px;box-shadow:0 10px 40px #000a;animation:pop .15s}
.mi{padding:11px 14px;border-radius:9px;cursor:pointer}.mi:hover{background:var(--ln)}.rxs{display:flex;justify-content:space-around;padding:4px;border-bottom:1px solid var(--ln);margin-bottom:4px}.rx{font-size:22px;padding:3px 5px;cursor:pointer}
#mod{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:14px;z-index:40}#mod.on{display:flex}
.card{width:100%;max-width:440px;max-height:92%;overflow-y:auto;background:var(--p1);border:1px solid var(--ln);border-radius:20px;padding:18px;animation:pop .25s}
.card h3{margin:0 0 8px}.card h5{margin:14px 0 4px;color:var(--ac2)}
.pc{text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}.pc h2{margin:6px 0 0}
.acts{display:grid;gap:6px;margin-top:12px}
.sw{display:flex;justify-content:space-between;align-items:center;padding:9px 2px;gap:10px}.sw input[type=checkbox]{width:44px;height:24px;accent-color:var(--ac)}.sw select{width:150px}
#toast{position:fixed;left:50%;top:14px;transform:translate(-50%,-80px);background:var(--p2);border:1px solid var(--ac);border-radius:14px;padding:10px 16px;z-index:60;transition:.3s;max-width:90%;box-shadow:0 8px 30px #000a}#toast.on{transform:translate(-50%,0)}
@keyframes pop{from{opacity:0;transform:scale(.92)}}@keyframes msgIn{from{opacity:0;transform:translateY(10px)}}@keyframes fl{0%,60%{outline:2px solid var(--ac2)}}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-thumb{background:var(--ln);border-radius:3px}
@media(max-width:760px){#side{width:100%}#main{position:absolute;inset:0;transform:translateX(100%);transition:transform .3s;background:var(--bg);z-index:5}body.co #main{transform:none}#bk{display:block}.b{max-width:86%}}

#emo{max-height:230px}.et{display:flex;gap:6px;padding:2px 2px 6px}.et b{flex:1;text-align:center;padding:8px;border-radius:10px;cursor:pointer;background:var(--bg)}.et b.on{background:var(--ac);color:#fff}
.eg{display:grid;grid-template-columns:repeat(8,1fr)}.sg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
#emo .sk{font-size:46px;line-height:1.1;padding:4px;text-align:center;cursor:pointer;border-radius:12px;width:100%;aspect-ratio:1;object-fit:contain;display:flex;align-items:center;justify-content:center;background:var(--bg)}
#emo img.sk{display:block}#emo .sk.add{font-size:32px;color:var(--ac2);border:2px dashed var(--ln)}
.b.stk{background:none!important;padding:2px}.b.stk img.sti{width:130px;max-width:55vw;border-radius:0;margin:0}.stbig{font-size:84px;line-height:1.1}
.b.stk .mt{float:none;display:inline-block;background:#0007;border-radius:8px;padding:0 6px;margin:2px 0 0}
.au{display:flex;align-items:center;gap:8px;min-width:210px}.ap{width:38px;height:38px;min-height:38px;border-radius:50%;padding:0;background:#fff3;color:#fff;flex:none}
.aw{flex:1;height:32px;display:flex;align-items:center;gap:2px;cursor:pointer}.aw i{flex:1;background:#fff5;border-radius:2px;min-height:3px}.aw i.on{background:#fff}
.m:not(.me) .aw i.on{background:var(--ac2)}.ad{font-size:.75em;opacity:.85;min-width:32px;text-align:right}
#rec{display:none;align-items:center}#rec .rdot{width:12px;height:12px;border-radius:50%;background:#ff4466;animation:bl 1s infinite;flex:none;margin:0 4px}
@keyframes bl{50%{opacity:.2}}#mic.on{color:#ff4466}
/* bubbles: mine right+bright, theirs left+darker */
.m:not(.me){justify-content:flex-start}.m.me{justify-content:flex-end}.m.me .b{filter:brightness(1.18) saturate(1.15);box-shadow:0 2px 12px #0007;color:#fff}.m:not(.me) .b{background:color-mix(in srgb,var(--bub) 72%,#000);box-shadow:none}
</style></head><body>
<div id="auth"><div class="acard"><h1 class="logo">NERTYGRAMM</h1>
<div class="tabs"><b data-t="l" class="on">Вход</b><b data-t="r">Регистрация</b></div>
<div id="fl"><input id="li" placeholder="Username"><input id="lp" type="password" placeholder="Пароль"><button class="pri" id="lb">Войти</button></div>
<div id="fr" hidden><div style="display:flex;gap:12px;align-items:center"><div id="rav"></div><button id="rpick" style="flex:1">Выбрать аватар</button></div><input id="rn" placeholder="Имя"><input id="ru" placeholder="Username (без @)"><input id="rp" type="password" placeholder="Пароль (от 4 символов)"><input id="rp2" type="password" placeholder="Повторите пароль"><button class="pri" id="rb">Создать аккаунт</button></div>
<div id="fc" hidden><p class="mu">Мы отправили код подтверждения. В демо-версии он показан во всплывающем уведомлении.</p><input id="cc" placeholder="Код из 4 цифр" inputmode="numeric"><button class="pri" id="cb">Подтвердить</button></div>
</div></div>
<div id="app">
<div id="side"><div class="sh"><h1 class="logo">NERTYGRAMM</h1><button id="ng" title="Новая группа">＋</button><button id="st" title="Настройки">⚙</button></div>
<input id="q" placeholder="🔍 Поиск: люди, @username, группы, сообщения"><div id="list"></div>
<div id="nav"><button data-n="all" class="on"><span>💬</span>Чаты</button><button data-n="arch"><span>🗄</span>Архив</button><button data-n="saved"><span>⭐</span>Избранное</button><button data-n="set"><span>👤</span>Профиль</button></div></div>
<div id="main"><div id="empty"><div class="logo" style="font-size:30px">NERTYGRAMM</div>Выберите чат, чтобы начать общение</div>
<div id="cv"><div class="ch"><button id="bk">←</button><div id="hi"><div id="hav"></div><div><div id="hn"></div><div id="hs"></div></div></div><button id="sch">🔍</button><button id="cal">📞</button><button id="hm">⋮</button></div>
<div id="pinb"><b>📌</b><span></span></div><div id="sb"><input id="sq" placeholder="Поиск по сообщениям чата"></div>
<div id="msgs"></div><div id="rbar"><div><b></b><span></span></div><button id="rx">✕</button></div><div id="emo"></div>
<div class="cmp" id="cmp"><button id="at">📎</button><button id="em">😊</button><textarea id="inp" rows="1" placeholder="Сообщение"></textarea><button id="mic" title="Голосовое сообщение">🎤</button><button class="snd" id="sd">➤</button></div><div class="cmp" id="rec"><button id="rcx" title="Отмена">🗑</button><i class="rdot"></i><b id="rt">0:00</b><span class="mu" style="flex:1">Идёт запись…</span><button class="snd" id="rok">➤</button></div></div></div>
</div>
<div id="ctx"></div><div id="mod"></div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const L=(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}};
const S=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){toast('Память браузера заполнена')}};
let users=L('ng_users',{}),me=null,D=null,cur=null,reply=null,edit=null,filt='all',typing={},qMsg='',lp=0,pend=null,regImg=null;
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hs=p=>{let h=5381;for(const c of p)h=(h*33^c.charCodeAt(0))>>>0;return h+''};
const hue=s=>{let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))%360;return h};
const av=(n,img,sz=44)=>`<div class="av" style="width:${sz}px;height:${sz}px;font-size:${sz*.4}px;${img?`background-image:url('${img}')`:`background:linear-gradient(135deg,hsl(${hue(n||'?')+250} 70% 55%),hsl(${hue(n||'?')+290} 70% 35%))`}">${img?'':esc((n||'?')[0].toUpperCase())}</div>`;
const tm=t=>new Date(t).toLocaleTimeString('ru',{hour:'2-digit',minute:'2-digit'});
const ago=t=>{const d=Date.now()-t;return d<6e4?'только что':d<36e5?Math.round(d/6e4)+' мин назад':d<864e5?'сегодня в '+tm(t):new Date(t).toLocaleDateString('ru')};
const save=()=>S('ng_d_'+me,D),chat=()=>D.chats.find(c=>c.id===cur),peer=c=>c.u?D.contacts[c.u]:null,last=c=>c.msgs[c.msgs.length-1];
const cimg=c=>c.type==='dm'?peer(c).img:c.img;
const toast=t=>{const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),2800)};
function rs(f,max,cb){const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const k=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.8))};i.src=r.result};r.readAsDataURL(f)}
function pick(max,cb){const i=document.createElement('input');i.type='file';i.accept='image/*';i.onchange=()=>i.files[0]&&rs(i.files[0],max,cb);i.click()}
function modal(h,fn){const m=$('#mod');clearInterval(m._ci);m.innerHTML=`<div class="card">${h}</div>`;m.classList.add('on');m._lock=0;m.onclick=e=>{if(e.target===m&&!m._lock)closeM()};fn&&fn(m.firstChild)}
const closeM=()=>{const m=$('#mod');clearInterval(m._ci);m.classList.remove('on')};
const ask=(t,f)=>modal(`<h3>${t}</h3><div class="acts"><button class="pri" id="y">Да</button><button id="n">Отмена</button></div>`,e=>{e.querySelector('#y').onclick=()=>{closeM();f()};e.querySelector('#n').onclick=closeM});
function menu(items,x,y,top,rx){setTimeout(()=>{const m=$('#ctx');m.innerHTML=(top||'')+items.map((it,i)=>`<div class="mi${it[2]?' dng':''}" data-i="${i}">${it[0]}</div>`).join('');m.style.display='block';m._it=items;m._rx=rx;m.style.left=Math.max(8,Math.min(x,innerWidth-m.offsetWidth-8))+'px';m.style.top=Math.max(8,Math.min(y,innerHeight-m.offsetHeight-8))+'px'},0)}
document.addEventListener('click',e=>{const m=$('#ctx'),mi=e.target.closest('#ctx .mi'),rx=e.target.closest('#ctx .rx');if(mi){const f=m._it[mi.dataset.i][1];m.style.display='none';f()}else if(rx){m.style.display='none';m._rx(rx.textContent)}else if(!e.target.closest('#ctx'))m.style.display='none'});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#mod')._lock)closeM()});
const pv=m=>m.au?'🎤 Голосовое':m.sti?'🎭 Стикер':m.st?m.st+' Стикер':m.img?'📷 Фото':(m.text||'');
function beep(){try{const a=new(window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=880;g.gain.value=.05;o.start();o.stop(a.currentTime+.12)}catch(e){}}
function notify(c,m){const s=D.settings;if(!s.notif||c.mute||(c.type==='group'&&!s.grp))return;toast('💬 '+c.name+': '+pv(m));if(s.sound)beep();if(s.vib&&navigator.vibrate)navigator.vibrate(80)}
/* ---------- auth ---------- */
document.querySelectorAll('.tabs b').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs b').forEach(x=>x.classList.toggle('on',x===b));const r=b.dataset.t==='r';$('#fl').hidden=r;$('#fr').hidden=!r;$('#fc').hidden=true});
$('#rpick').onclick=()=>pick(256,d=>{regImg=d;$('#rav').innerHTML=av('?',d,48)});
$('#lb').onclick=()=>{const id=$('#li').value.trim().toLowerCase().replace(/^@/,''),k=Object.keys(users).find(k=>k===id||users[k].contact.toLowerCase()===id);if(!k||users[k].pass!==hs($('#lp').value))return toast('Неверный логин или пароль');login(k)};
$('#rb').onclick=()=>{const c=$('#rc').value.trim(),n=$('#rn').value.trim(),u=$('#ru').value.trim().toLowerCase().replace(/^@/,''),p=$('#rp').value;
if(!c||!n||!/^[a-z0-9_]{3,20}$/.test(u))return toast('Заполните поля; username: 3–20 латинских букв, цифр, _');if(p.length<4)return toast('Пароль минимум 4 символа');if(users[u])return toast('Username занят');
pend={c,n,u,p,code:String(1000+Math.random()*9000|0)};$('#fr').hidden=true;$('#fc').hidden=false;toast('Код подтверждения: '+pend.code)};
$('#cb').onclick=()=>{if($('#cc').value.trim()!==pend.code)return toast('Неверный код');users[pend.u]={name:pend.n,contact:pend.c,pass:hs(pend.p),bio:'',img:regImg,status:'В сети'};S('ng_users',users);login(pend.u)};
function seed(u){const n=Date.now(),B={alisa:['Алиса','Дизайнер. Люблю фиолетовый 💜'],max:['Макс','Разработчик, кофеман ☕'],nika:['Ника','Музыка и путешествия 🎧']},C={};
for(const k in B)C[k]={n:B[k][0],bio:B[k][1],online:k!=='nika',seen:n-9e5*(k.length),bot:1};
